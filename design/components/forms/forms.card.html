<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const { TextField, PhoneField, Select } = window.HustlrDesignSystem_3816fd;
function Demo(){
  const [name,setName]=React.useState("");
  const [phone,setPhone]=React.useState("");
  const [state,setState]=React.useState("");
  return (
    <div style={{display:"flex",gap:16,fontFamily:"var(--font-sans)"}}>
      <div style={{width:200}}><TextField label="Full name" value={name} onChange={setName} placeholder="e.g. Amaka Obi" /></div>
      <div style={{width:200}}><PhoneField value={phone} onChange={setPhone} /></div>
      <div style={{width:200}}><Select label="State" value={state} onChange={setState} placeholder="Select state" options={[{value:"lagos",label:"Lagos"},{value:"abuja",label:"Abuja (FCT)"},{value:"rivers",label:"Rivers"}]} /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
