<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--ink-900);display:flex;align-items:center;justify-content:center}
.wordmark{font-family:var(--font-sans);font-weight:700;font-size:150px;letter-spacing:-0.03em;color:var(--lime-400)}
.strip{width:140px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body><div class="wrap">
<div class="main"><div class="wordmark">Hustlr</div></div>
<div class="strip">
<div style="background:var(--lime-400)"></div>
<div style="background:var(--gold-500)"></div>
<div style="background:var(--red-500)"></div>
<div style="background:var(--blue-500)"></div>
</div>
</div></body></html>
