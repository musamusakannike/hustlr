<!-- @dsCard group="Brand" viewport="700x160" subtitle="Corner radii, sm to pill" name="Corner Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app);display:flex;gap:14px;align-items:flex-end}
.box{width:70px;height:70px;background:var(--ink-100);border:1px solid var(--border-default);display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--text-tertiary);padding-bottom:4px}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm 8</div>
<div class="box" style="border-radius:var(--radius-md)">md 14</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 20</div>
<div class="box" style="border-radius:var(--radius-xl)">xl 28</div>
<div class="box" style="border-radius:var(--radius-pill)">pill</div>
</body></html>
