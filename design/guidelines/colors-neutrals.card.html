<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app)}
.row{display:flex;gap:8px}
.sw{flex:1;height:80px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;font-size:11px;border:1px solid var(--border-default)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--ink-0)">0</div>
<div class="sw" style="background:var(--ink-50)">50</div>
<div class="sw" style="background:var(--ink-100)">100 · app bg</div>
<div class="sw" style="background:var(--ink-200)">200 · border</div>
<div class="sw" style="background:var(--ink-300)">300</div>
<div class="sw" style="background:var(--ink-500);color:#fff">500</div>
<div class="sw" style="background:var(--ink-700);color:#fff">700</div>
<div class="sw" style="background:var(--ink-900);color:#fff">900 · text/ink</div>
</div>
</body></html>
