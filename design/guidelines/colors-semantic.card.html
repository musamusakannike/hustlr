<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app)}
.row{display:flex;gap:8px}
.sw{flex:1;height:80px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--red-500)">Error / Sale tag</div>
<div class="sw" style="background:var(--blue-500)">Selected variant</div>
<div class="sw" style="background:var(--gold-500)">Rating star</div>
<div class="sw" style="background:var(--green-600)">Success / in stock</div>
</div>
</body></html>
