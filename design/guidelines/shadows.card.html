<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-app);display:flex;gap:24px}

<div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
