<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4px-rooted scale" name="Spacing Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-app);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.bar{background:var(--lime-400);height:14px;border-radius:4px}
.lbl{font-size:11px;color:var(--text-tertiary);width:70px}
</style></head><body>
<div class="row"><span class="lbl">4</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="lbl">8</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">12</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">16</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">20 · gutter</span><div class="bar" style="width:20px"></div></div>
<div class="row"><span class="lbl">24</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">32</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">48</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="lbl">64</span><div class="bar" style="width:64px"></div></div>
</body></html>
