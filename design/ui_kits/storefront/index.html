<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hustlr Storefront</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ink-200);display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-sans)}
.phone{width:390px;height:760px;background:var(--surface-app);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;border:8px solid var(--ink-900)}
</style>
</head><body>
<div class="phone"><div id="root" style="width:100%;height:100%"></div></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="PDP.jsx"></script>
<script type="text/babel" src="Cart.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel" src="Confirmation.jsx"></script>
<script type="text/babel">
function App(){
  const [screen, setScreen] = React.useState("home");
  const [activeProduct, setActiveProduct] = React.useState(null);
  const [cart, setCart] = React.useState([]);

  const openProduct = (p) => { setActiveProduct(p); setScreen("pdp"); };
  const addToCart = (item) => {
    setCart((c) => {
      const existing = c.find((i) => i.id === item.id && i.size === item.size && i.color === item.color);
      if (existing) return c.map((i) => i === existing ? { ...i, qty: i.qty + 1 } : i);
      return [...c, { ...item, qty: 1 }];
    });
    setScreen("cart");
  };
  const changeQty = (item, delta) => {
    setCart((c) => c.map((i) => i === item ? { ...i, qty: Math.max(1, i.qty + delta) } : i).filter((i) => i.qty > 0));
  };
  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  if (screen === "pdp" && activeProduct) return <window.PDPScreen product={activeProduct} onBack={() => setScreen("home")} onAddToCart={addToCart} />;
  if (screen === "cart") return <window.CartScreen items={cart} onQty={changeQty} onBack={() => setScreen("home")} onCheckout={() => setScreen("checkout")} />;
  if (screen === "checkout") return <window.CheckoutScreen items={cart} onBack={() => setScreen("cart")} onPlaceOrder={() => setScreen("confirmation")} />;
  if (screen === "confirmation") return <window.ConfirmationScreen onContinue={() => { setCart([]); setScreen("home"); }} />;
  return <window.HomeScreen onOpenProduct={openProduct} cartCount={cartCount} onOpenCart={() => setScreen("cart")} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
